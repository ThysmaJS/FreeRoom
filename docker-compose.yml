services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amphi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amphi}
      POSTGRES_DB: ${POSTGRES_DB:-amphi_libre}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amphi} -d ${POSTGRES_DB:-amphi_libre}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-amphi}:${POSTGRES_PASSWORD:-amphi}@db:5432/${POSTGRES_DB:-amphi_libre}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
    expose:
      - "3000"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  db_data:
